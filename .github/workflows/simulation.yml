name: RTL Simulation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog make

      - name: Run RTL simulation
        run: make -B test
